<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Enviar dinero | Alke Wallet</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="menu.html"
            >
                Alke Wallet
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-label="Abrir menú"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="menu.html"
                        >
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="deposit.html"
                        >
                            Depositar
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="withdraw.html"
                        >
                            Retirar
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="sendmoney.html"
                        >
                            Enviar dinero
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="transactions.html"
                        >
                            Movimientos
                        </a>

                    </li>


                    <li class="nav-item">

                        <button
                            id="logoutButton"
                            class="btn btn-link nav-link"
                        >
                            Cerrar sesión
                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- CONTENIDO -->

    <main class="container py-5">


        <div class="row justify-content-center">

            <div class="col-12 col-lg-8">


                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">


                        <div class="text-center mb-4">

                            <div class="page-icon send-icon mx-auto">
                                →
                            </div>

                            <h1 class="h2 fw-bold mt-3">
                                Enviar dinero
                            </h1>

                            <p class="text-muted">
                                Envía fondos a tus contactos.
                            </p>

                        </div>


                        <!-- SALDO -->

                        <div class="alert alert-info">

                            <strong>
                                Saldo disponible:
                            </strong>

                            <span id="sendBalance">
                                $100.000
                            </span>

                        </div>



                        <!-- CONTACTOS -->

                        <div class="d-flex justify-content-between align-items-center mb-2">

                            <label
                                for="contactSearch"
                                class="form-label fw-semibold mb-0"
                            >
                                Buscar contacto
                            </label>


                            <button
                                type="button"
                                class="btn btn-sm btn-outline-primary"
                                data-bs-toggle="modal"
                                data-bs-target="#contactModal"
                            >
                                + Nuevo contacto
                            </button>

                        </div>


                        <!-- FORMULARIO -->

                        <form id="sendMoneyForm">


                            <div class="mb-3">

                                <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    id="contactSearch"
                                    placeholder="Escribe el nombre del contacto"
                                    autocomplete="off"
                                    required
                                >


                                <div
                                    id="contactSuggestions"
                                    class="list-group mt-2"
                                ></div>

                            </div>



                            <!-- CONTACTO SELECCIONADO -->

                            <div
                                id="selectedContact"
                                class="alert alert-secondary d-none"
                            >

                                Contacto seleccionado:

                                <strong
                                    id="selectedContactName"
                                ></strong>

                            </div>



                            <!-- MONTO -->

                            <div class="mb-3">

                                <label
                                    for="sendAmount"
                                    class="form-label fw-semibold"
                                >
                                    Monto a enviar
                                </label>


                                <input
                                    type="number"
                                    class="form-control form-control-lg"
                                    id="sendAmount"
                                    min="1"
                                    step="1"
                                    placeholder="Ej: 30000"
                                    required
                                >

                            </div>


                            <!-- MENSAJE -->

                            <div id="sendMessage"></div>


                            <!-- BOTÓN -->

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100"
                            >
                                Enviar dinero
                            </button>


                        </form>


                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- =====================================================
         MODAL NUEVO CONTACTO
    ====================================================== -->

    <div
        class="modal fade"
        id="contactModal"
        tabindex="-1"
        aria-labelledby="contactModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <div class="modal-header">

                    <h2
                        class="modal-title fs-5"
                        id="contactModalLabel"
                    >
                        Agregar nuevo contacto
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Cerrar"
                    ></button>

                </div>


                <form id="contactForm">


                    <div class="modal-body">


                        <div class="mb-3">

                            <label
                                for="contactName"
                                class="form-label"
                            >
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="contactName"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label
                                for="contactAccount"
                                class="form-label"
                            >
                                Cuenta
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="contactAccount"
                                placeholder="Ej: nuevo.contacto"
                                required
                            >

                        </div>


                        <div id="contactMessage"></div>


                    </div>


                    <div class="modal-footer">

                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancelar
                        </button>


                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Guardar contacto
                        </button>

                    </div>


                </form>

            </div>

        </div>

    </div>



    <!-- Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
    ></script>


    <!-- JS -->

    <script src="js/app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movimientos | Alke Wallet</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="menu.html"
            >
                Alke Wallet
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-label="Abrir menú"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu"
            >

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="menu.html"
                        >
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="deposit.html"
                        >
                            Depositar
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="withdraw.html"
                        >
                            Retirar
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="sendmoney.html"
                        >
                            Enviar dinero
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="transactions.html"
                        >
                            Movimientos
                        </a>

                    </li>


                    <li class="nav-item">

                        <button
                            id="logoutButton"
                            class="btn btn-link nav-link"
                        >
                            Cerrar sesión
                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- CONTENIDO -->

    <main class="container py-5">


        <section class="mb-4">

            <p class="text-primary fw-semibold mb-1">
                Historial financiero
            </p>

            <h1 class="fw-bold">
                Últimos movimientos
            </h1>

            <p class="text-muted">
                Consulta todas las operaciones realizadas.
            </p>

        </section>



        <!-- SALDO -->

        <section class="mb-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="h5">
                        Saldo disponible
                    </h2>

                    <p
                        id="transactionBalance"
                        class="display-5 fw-bold mb-0"
                    >
                        $100.000
                    </p>

                </div>

            </div>

        </section>



        <!-- MOVIMIENTOS -->

        <section>

            <div class="card shadow-sm">

                <div class="card-body">

                    <h2 class="h4 mb-4">
                        Historial de transacciones
                    </h2>


                    <div
                        id="transactionsList"
                        class="list-group"
                    ></div>


                </div>

            </div>

        </section>


    </main>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
    ></script>


    <script src="js/app.js"></script>

</body>

</html>

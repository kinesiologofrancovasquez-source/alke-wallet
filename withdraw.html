<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Retirar | Alke Wallet</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="menu.html"
            >
                Alke Wallet
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-label="Abrir menú"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarMenu"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="menu.html"
                        >
                            Inicio
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="deposit.html"
                        >
                            Depositar
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="withdraw.html"
                        >
                            Retirar
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="sendmoney.html"
                        >
                            Enviar dinero
                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="transactions.html"
                        >
                            Movimientos
                        </a>

                    </li>


                    <li class="nav-item">

                        <button
                            id="logoutButton"
                            class="btn btn-link nav-link"
                        >
                            Cerrar sesión
                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">


                <div class="card shadow-sm">

                    <div class="card-body p-4 p-md-5">


                        <div class="text-center mb-4">

                            <div class="page-icon withdraw-icon mx-auto">
                                −
                            </div>

                            <h1 class="h2 fw-bold mt-3">
                                Retirar dinero
                            </h1>

                            <p class="text-muted">
                                Retira fondos disponibles de tu billetera.
                            </p>

                        </div>


                        <!-- SALDO -->

                        <div class="alert alert-info">

                            <strong>
                                Saldo disponible:
                            </strong>

                            <span id="withdrawBalance">
                                $100.000
                            </span>

                        </div>


                        <!-- FORMULARIO -->

                        <form id="withdrawForm">


                            <div class="mb-3">

                                <label
                                    for="withdrawAmount"
                                    class="form-label fw-semibold"
                                >
                                    Monto a retirar
                                </label>

                                <input
                                    type="number"
                                    class="form-control form-control-lg"
                                    id="withdrawAmount"
                                    min="1"
                                    step="1"
                                    placeholder="Ej: 20000"
                                    required
                                >

                            </div>


                            <div id="withdrawMessage"></div>


                            <button
                                type="submit"
                                class="btn btn-danger btn-lg w-100"
                            >
                                Realizar retiro
                            </button>


                        </form>


                    </div>

                </div>

            </div>

        </div>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
    ></script>


    <script src="js/app.js"></script>

</body>

</html>

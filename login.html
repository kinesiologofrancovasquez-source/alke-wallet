<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Inicio de sesión de Alke Wallet."
    >

    <title>Iniciar sesión | Alke Wallet</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- CSS propio -->

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>


<body class="login-page">


    <main
        class="container min-vh-100 d-flex justify-content-center align-items-center"
    >

        <section class="card shadow login-card">

            <div class="card-body p-4 p-md-5">


                <!-- LOGO -->

                <div class="text-center mb-4">

                    <div class="wallet-icon mx-auto mb-3">
                        $
                    </div>

                    <h1 class="fw-bold">
                        Alke Wallet
                    </h1>

                    <p class="text-muted">
                        Ingresa a tu billetera digital
                    </p>

                </div>


                <!-- LOGIN -->

                <form id="loginForm">


                    <!-- USUARIO -->

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label fw-semibold"
                        >
                            Usuario
                        </label>

                        <input
                            type="text"
                            class="form-control form-control-lg"
                            id="username"
                            name="username"
                            placeholder="Ingresa tu usuario"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <!-- CONTRASEÑA -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label fw-semibold"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control form-control-lg"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- MENSAJE -->

                    <div id="loginMessage"></div>


                    <!-- BOTÓN -->

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg w-100"
                    >
                        Iniciar sesión
                    </button>


                </form>


                <div class="text-center mt-4">

                    <small class="text-muted">
                        Demo académica - Alke Wallet
                    </small>

                </div>


            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="js/app.js"></script>

</body>

</html>
